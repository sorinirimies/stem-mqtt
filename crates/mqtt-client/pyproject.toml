[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "stem-mqtt-client"
description = "A full MQTT 3.1.1 / MQTT 5.0 client, implemented in Rust (UniFFI bindings)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/sorinirimies/stem-mqtt"

[tool.maturin]
# maturin's built-in UniFFI support: generates the Python wrapper from the
# compiled cdylib at build time via `uniffi-bindgen`, no manual codegen step.
bindings = "uniffi"
module-name = "mqtt_client"
manifest-path = "Cargo.toml"
