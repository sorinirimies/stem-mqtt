[package]
name = "stem-mqtt-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "An MQTT 3.1.1 / MQTT 5.0 client implemented in Rust with UniFFI bindings for Kotlin, Swift, and Python."
readme = "README.md"
categories = ["network-programming", "asynchronous"]
keywords = ["mqtt", "mqtt5", "iot", "uniffi", "networking"]

[lib]
name = "mqtt_client"
# Only `lib`: the bindings' cdylib/staticlib are built on demand with
# `cargo rustc --lib --crate-type cdylib,staticlib`. Cargo names a cdylib crate's
# rlib without a hash, so builds with different dependency features (`-p` vs
# `--workspace`) overwrote one another and a stale rlib linked a second tokio
# ("no reactor running" in tests).
crate-type = ["lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[dependencies]
tokio     = { workspace = true }
bytes     = { workspace = true }
uniffi    = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }
rustls         = { workspace = true }
tokio-rustls   = { workspace = true }
webpki-roots   = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
anyhow             = { workspace = true }
tracing-subscriber = { workspace = true }
rcgen              = { workspace = true }

[[bench]]
name = "codec"
harness = false

[lints]
workspace = true
