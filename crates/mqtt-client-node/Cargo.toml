[package]
name = "mqtt-client-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Node.js / TypeScript bindings for mqtt-client, via napi-rs."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mqtt-client = { workspace = true }
tokio        = { workspace = true }
napi         = { version = "3", default-features = false, features = ["napi4", "async", "tokio_rt"] }
napi-derive  = "3"

[build-dependencies]
napi-build = "2"
