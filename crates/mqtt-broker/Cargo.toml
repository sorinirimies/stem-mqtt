[package]
name = "stem-mqtt-broker"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "An MQTT 3.1.1 / MQTT 5.0 broker implemented in Rust with UniFFI bindings for Kotlin, Swift, and Python."
readme = "README.md"
categories = ["network-programming", "asynchronous"]
keywords = ["mqtt", "mqtt5", "broker", "uniffi", "iot"]

[lib]
name = "mqtt_broker"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[[bin]]
name = "mqtt-broker"
path = "src/bin/mqtt-broker.rs"

[dependencies]
mqtt-client = { workspace = true }
tokio        = { workspace = true }
bytes        = { workspace = true }
uniffi       = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
clap         = { workspace = true }
anyhow       = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util      = { workspace = true }
rustls         = { workspace = true }
tokio-rustls   = { workspace = true }

[features]
# Re-exports internals (`mqtt_broker::internals`) for the Criterion benches only.
bench-internals = []

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
rcgen = { workspace = true }

[[bench]]
name = "fanout"
harness = false
required-features = ["bench-internals"]
