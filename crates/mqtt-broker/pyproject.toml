[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "stem-mqtt-broker"
description = "A full MQTT 3.1.1 / MQTT 5.0 broker, implemented in Rust (UniFFI bindings)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/sorinirimies/stem-mqtt"

[tool.maturin]
bindings = "uniffi"
module-name = "mqtt_broker"
manifest-path = "Cargo.toml"
