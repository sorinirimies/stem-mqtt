[workspace]
members = [
    "crates/mqtt-client",
    "crates/mqtt-broker",
    "demo/dashboard",
]
resolver = "2"

[workspace.package]
version      = "0.3.1"
edition      = "2021"
authors      = ["Sorin Irimies <sorinirimies@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/sorinirimies/stem-mqtt"
rust-version = "1.75"

# ── Shared dependency versions ────────────────────────────────────────────────
# Pin versions here once; each crate's Cargo.toml references them with
# `{ workspace = true }` so there is a single source of truth.

[workspace.dependencies]
# Async runtime & networking
anyhow      = "1"
tokio      = { version = "1", features = ["full"] }
bytes      = "1"
tokio-tungstenite = "0.24"
futures-util      = { version = "0.3", default-features = false, features = ["sink", "std"] }

# TLS (client + broker) — pure-Rust rustls, no OpenSSL/system-TLS dependency
rustls         = { version = "0.23", default-features = false, features = ["tls12", "ring", "std"] }
tokio-rustls   = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
webpki-roots   = "0.26"
# Self-signed cert generation, for TLS integration tests only.
rcgen          = { version = "0.14", default-features = false, features = ["ring", "pem"] }

# UniFFI language bindings
uniffi     = { version = "0.31", features = ["tokio"] }

# Error handling / logging
thiserror  = "2"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
rand       = "0.9"
clap       = { version = "4", features = ["derive"] }

# Internal crates
mqtt-client = { package = "stem-mqtt-client", path = "crates/mqtt-client", version = "0.3.1" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
# Keep exported UniFFI metadata symbols on ELF platforms; stripping all
# symbols makes Linux bindgen silently generate empty output directories.
strip         = "debuginfo"