# ──────────────────────────────────────────────────────────────────────────────
# Auto-merge — automatically merge Dependabot PRs
# ──────────────────────────────────────────────────────────────────────────────
# Dependabot is configured for GitHub Actions only (see .github/dependabot.yml).
# Cargo dependency upgrades are handled by the Nightly Dependency Upgrade
# workflow on Gitea (.gitea/workflows/deps-update.yml).
#
# If CI passes, patch and minor Action bumps are approved and merged
# automatically so they don't pile up. Major bumps of GitHub Actions are merged
# too (CI is the gate); majors of other ecosystems require manual review.
#
# Requirements:
#   • The repo must have "Allow auto-merge" enabled in Settings → General.
#   • Branch protection rules must require status checks to pass before merging.
# ──────────────────────────────────────────────────────────────────────────────

name: Auto-merge Dependabot

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge (squash)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' || steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
