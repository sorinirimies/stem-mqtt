# Self-healing security: when the nightly audit finds a vulnerability, try the
# cheapest fix (a semver-compatible `cargo update`) and open a PR with it.
# CI on that PR (incl. cargo audit) is the gate; auto-merge.yml is not involved.
name: Audit self-heal

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit; if vulnerable, update lockfile and re-audit
        id: heal
        run: |
          if cargo audit; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          cargo update
          cargo audit   # still failing => needs a human; fails the job (visible alert)
          cargo check --workspace --all-targets
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open PR
        if: steps.heal.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/audit-heal
          commit-message: "fix(deps): cargo update to resolve security advisories"
          title: "fix(deps): resolve security advisories"
          body: "Automated: `cargo audit` failed on main; `cargo update` fixes it and the tree still builds."
          labels: dependencies,security
