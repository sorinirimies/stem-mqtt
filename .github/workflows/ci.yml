name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

env:
  CARGO_TERM_COLOR: always

# Cancel any in-progress run for the same workflow + branch/PR so a new push
# immediately supersedes a stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Formatting ────────────────────────────────────────────────────────────
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting (workspace)
        run: cargo fmt --all -- --check

  # ── 2. Clippy ────────────────────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy (workspace)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── 3. Tests ─────────────────────────────────────────────────────────────────
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Generate lockfile (if absent)
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile

      - name: cargo test --workspace
        run: cargo test --workspace --all-features --all-targets

  # ── 4. Build (dev) ───────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build mqtt-client (dev)
        run: cargo build -p stem-mqtt-client

      - name: Build mqtt-broker (dev)
        run: cargo build -p stem-mqtt-broker

      - name: Build every example
        run: cargo build --workspace --examples

  # ── 5. Docs ──────────────────────────────────────────────────────────────────
  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: cargo doc (mqtt-client)
        run: cargo doc --no-deps -p stem-mqtt-client --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

      - name: cargo doc (mqtt-broker)
        run: cargo doc --no-deps -p stem-mqtt-broker --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  # ── 6. Nu script tests ───────────────────────────────────────────────────────
  test-nu:
    name: test-nu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate lockfile (if absent)
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile

      - name: Install Nushell
        run: cargo install nu --locked

      - name: Run Nu script tests
        run: nu scripts/tests/run_all.nu

  # ── 7. Node.js bindings (napi-rs) ─────────────────────────────────────────────
  test-node:
    name: test-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24.12"

      - name: npm ci
        working-directory: crates/mqtt-client-node
        run: npm ci

      - name: Build and inspect native addon package
        working-directory: crates/mqtt-client-node
        run: |
          npm run build:debug
          test -s index.js
          test -s index.d.ts
          npm pack --dry-run

      - name: Build broker
        run: cargo build -p stem-mqtt-broker --bin mqtt-broker

      - name: Start a broker and run the Node smoke test
        working-directory: crates/mqtt-client-node
        run: |
          set -euo pipefail
          ../../target/debug/mqtt-broker --port 18830 >broker.log 2>&1 &
          broker_pid=$!
          trap 'kill "$broker_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/18830) 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          (echo > /dev/tcp/127.0.0.1/18830) 2>/dev/null || {
            cat broker.log
            exit 1
          }
          node scripts/smoke_test.mjs

  # ── 8. Linux UniFFI metadata + generated bindings ────────────────────────────
  test-bindings-linux:
    name: test-bindings-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate Kotlin client + broker bindings
        run: |
          ./scripts/generate-bindings.sh kotlin mqtt-client
          ./scripts/generate-bindings.sh kotlin mqtt-broker
      - name: Verify generated broker lifecycle API
        run: |
          test -s bindings/kotlin/mqtt-client/uniffi/mqtt_client/mqtt_client.kt
          test -s bindings/kotlin/mqtt-broker/uniffi/mqtt_broker/mqtt_broker.kt
          grep -q 'override suspend fun .*start' bindings/kotlin/mqtt-broker/uniffi/mqtt_broker/mqtt_broker.kt
          grep -q 'override suspend fun .*stop' bindings/kotlin/mqtt-broker/uniffi/mqtt_broker/mqtt_broker.kt

  # ── 9. Linux Python wheel runtime ─────────────────────────────────────────────
  test-python-packaging:
    name: test-python-packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build client + broker wheels
        run: |
          pip install maturin
          maturin build --release --manifest-path crates/mqtt-client/Cargo.toml
          maturin build --release --manifest-path crates/mqtt-broker/Cargo.toml
      - name: Install and smoke-test wheels
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "stem-mqtt-client") | .version')
          python -m pip install --no-index --find-links target/wheels \
            "stem-mqtt-client==$version" "stem-mqtt-broker==$version"
          python packaging/python/smoke_test.py

  # ── 10. Linux aarch64 Node cross-build ───────────────────────────────────────
  build-node-linux-arm64:
    name: build-node-linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12"
      - name: Install Node dependencies, including optional cross-toolchain
        working-directory: crates/mqtt-client-node
        run: npm ci --include=optional
      - name: Build Linux aarch64 addon
        working-directory: crates/mqtt-client-node
        run: npx napi build --platform --release --target aarch64-unknown-linux-gnu --use-napi-cross --js index.js --dts index.d.ts
      - name: Verify artifact
        run: test -s crates/mqtt-client-node/mqtt-client.linux-arm64-gnu.node
