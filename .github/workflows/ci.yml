name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
  # Weekly: the third-party generators are community projects pinned in
  # scripts/bindings/spec.nu — a scheduled run surfaces upstream drift without
  # waiting for a push.
  schedule:
    - cron: "0 5 * * 1"

env:
  CARGO_TERM_COLOR: always

# Cancel any in-progress run for the same workflow + branch/PR so a new push
# immediately supersedes a stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Formatting ────────────────────────────────────────────────────────────
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting (workspace)
        run: cargo fmt --all -- --check

  # ── 2. Clippy ────────────────────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy (workspace)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── 3. Tests ─────────────────────────────────────────────────────────────────
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Generate lockfile (if absent)
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile

      - name: cargo test --workspace
        run: cargo test --workspace --all-features --all-targets

  # ── 4. Build (dev) ───────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build mqtt-client (dev)
        run: cargo build -p stem-mqtt-client

      - name: Build mqtt-broker (dev)
        run: cargo build -p stem-mqtt-broker

      - name: Build every example
        run: cargo build --workspace --examples

  # ── 5. Docs ──────────────────────────────────────────────────────────────────
  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: cargo doc (mqtt-client)
        run: cargo doc --no-deps -p stem-mqtt-client --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

      - name: cargo doc (mqtt-broker)
        run: cargo doc --no-deps -p stem-mqtt-broker --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  # ── 6. Nu script tests ───────────────────────────────────────────────────────
  test-nu:
    name: test-nu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate lockfile (if absent)
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile

      - name: Install Nushell
        run: |
          V=0.116.1
          curl -fsSL https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version

      - name: Run Nu script tests
        run: nu scripts/tests/run_all.nu

  # ── 8. Linux UniFFI metadata + generated bindings ────────────────────────────
  test-bindings-linux:
    name: test-bindings-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Nushell
        run: |
          V=0.116.1
          curl -fsSL https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version
      - name: Generate Kotlin client + broker bindings
        run: |
          nu scripts/generate_bindings.nu kotlin mqtt-client
          nu scripts/generate_bindings.nu kotlin mqtt-broker
      - name: Verify generated broker lifecycle API
        run: |
          test -s bindings/kotlin/mqtt-client/uniffi/mqtt_client/mqtt_client.kt
          test -s bindings/kotlin/mqtt-broker/uniffi/mqtt_broker/mqtt_broker.kt
          grep -q 'override suspend fun .*start' bindings/kotlin/mqtt-broker/uniffi/mqtt_broker/mqtt_broker.kt
          grep -q 'override suspend fun .*stop' bindings/kotlin/mqtt-broker/uniffi/mqtt_broker/mqtt_broker.kt

  # ── 8c. Runtime tests: do the generated bindings actually WORK? ───────────────
  # Generates every language's bindings, stages a scratch project with the
  # smoke test in tests/bindings/<language>/, and runs a real broker + clients
  # through them (see scripts/test_bindings.nu).
  test-bindings-runtime:
    name: runtime-${{ matrix.language }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
        language: [python, swift, go, csharp, java, dart, node, haskell]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Nushell (Linux prebuilt)
        if: runner.os == 'Linux'
        run: |
          V=0.116.1
          curl -fsSL https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version
      - name: Install Nushell (build)
        if: runner.os != 'Linux'
        run: cargo install nu --locked
      - uses: actions/setup-python@v7
        if: matrix.language == 'python'
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        id: setup_go
        continue-on-error: true
        if: matrix.language == 'go'
        with:
          go-version: "1.24.x"
      # `setup-go` can exit 0 without leaving `go` on PATH when the runner's
      # download is cut short, so verify, and fall back to go.dev if needed.
      - name: Verify Go
        id: go_check
        if: matrix.language == 'go'
        continue-on-error: true
        run: go version
      - name: Install Go from go.dev (fallback)
        if: matrix.language == 'go' && steps.go_check.outcome == 'failure'
        run: |
          set -euo pipefail
          case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;; *) echo "unsupported arch"; exit 1 ;; esac
          ver=$(curl -fsSL --retry 5 --retry-all-errors 'https://go.dev/dl/?mode=json&include=all' \
            | python3 -c "import sys,json; print(next(r['version'] for r in json.load(sys.stdin) if r['stable'] and r['version'].startswith('go1.24.')))")
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/go.tgz "https://go.dev/dl/${ver}.linux-${arch}.tar.gz"
          mkdir -p "$HOME/go-fallback"
          tar -C "$HOME/go-fallback" -xzf /tmp/go.tgz
          echo "$HOME/go-fallback/go/bin" >> "$GITHUB_PATH"
      - name: Go toolchain ready
        if: matrix.language == 'go'
        run: go version
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v5
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "22"
      - uses: dart-lang/setup-dart@v1
        if: matrix.language == 'dart'
      - uses: actions/setup-node@v4
        if: matrix.language == 'node'
        with:
          node-version: "22"
      - uses: haskell-actions/setup@v2
        if: matrix.language == 'haskell'
      - uses: swift-actions/setup-swift@v2
        if: matrix.language == 'swift'
      # The generators are `cargo install`ed from git; cache them (keyed by their pins).
      - name: Restore generator cache
        if: matrix.language != 'python'
        uses: actions/cache@v4
        with:
          path: ~/.bindgens
          key: bindgens-${{ matrix.language }}-${{ hashFiles('scripts/bindings/spec.nu', 'packaging/haskell/uniffi-bindgen-haskell.patch') }}
      - name: Install the generator
        if: matrix.language != 'python'
        run: |
          export PATH="$HOME/.bindgens/bin:$PATH"
          echo "$HOME/.bindgens/bin" >> $GITHUB_PATH
          nu scripts/install_bindgens.nu ${{ matrix.language }} --root "$HOME/.bindgens"
      - name: Runtime-test ${{ matrix.language }}
        run: nu scripts/test_bindings.nu ${{ matrix.language }} --strict

  # ── 8d. Kotlin: packaged bindings + the existing Gradle smoke test ───────────
  test-kotlin-runtime:
    name: runtime-kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Nushell
        run: |
          V=0.116.1
          curl -fsSL https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate + stage client and broker
        run: |
          nu scripts/generate_bindings.nu kotlin mqtt-client
          nu scripts/generate_bindings.nu kotlin mqtt-broker
          ./packaging/kotlin/stage.sh 0.0.0-ci
      - name: Run the packaged-library smoke test
        working-directory: packaging/kotlin
        run: gradle test --no-daemon

  # ── 8e. Do the per-language packages build? (no upload, no credentials) ──────
  # Stages each language and runs its registry's build step: dotnet pack
  # (NuGet), gradle build (Maven), npm pack, or assembling the OCI bundle.
  test-packaging:
    name: package-${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        language: [java, csharp, node, go, dart, haskell]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Nushell
        run: |
          V=0.116.1
          curl -fsSL https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v5
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "22"
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.language == 'java'
      - uses: actions/setup-node@v4
        if: matrix.language == 'node'
        with:
          node-version: "22"
      - uses: dart-lang/setup-dart@v1
        if: matrix.language == 'dart'
      # The generators are `cargo install`ed from git; cache them (keyed by their pins).
      - name: Restore generator cache
        uses: actions/cache@v4
        with:
          path: ~/.bindgens
          key: bindgens-${{ matrix.language }}-${{ hashFiles('scripts/bindings/spec.nu', 'packaging/haskell/uniffi-bindgen-haskell.patch') }}
      - name: Install the generator
        run: |
          export PATH="$HOME/.bindgens/bin:$PATH"
          echo "$HOME/.bindgens/bin" >> $GITHUB_PATH
          nu scripts/install_bindgens.nu ${{ matrix.language }} --root "$HOME/.bindgens"
      - name: Stage and build the ${{ matrix.language }} package
        run: nu scripts/publish_packages.nu verify ${{ matrix.language }}

  # ── 9. Linux Python wheel runtime ─────────────────────────────────────────────
  test-python-packaging:
    name: test-python-packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build client + broker wheels
        run: |
          pip install maturin
          maturin build --release --manifest-path crates/mqtt-client/Cargo.toml
          maturin build --release --manifest-path crates/mqtt-broker/Cargo.toml
      - name: Install and smoke-test wheels
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "stem-mqtt-client") | .version')
          python -m pip install --no-index --find-links target/wheels \
            "stem-mqtt-client==$version" "stem-mqtt-broker==$version"
          python packaging/python/smoke_test.py

  # ── 10. Generator drift (weekly / manual only) ───────────────────────────────
  # Third-party generators are pinned in scripts/bindings/spec.nu; this reports
  # which have newer upstream releases (and, for tag-pinned ones, the UniFFI
  # release they target) so bumps are deliberate instead of a surprise breakage.
  bindgen-updates:
    name: bindgen-updates
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Nushell
        run: |
          V=0.116.1
          curl -fsSL https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version

      - name: Compare pins with upstream
        run: nu scripts/check_bindgen_updates.nu

  # ── 11. Dependency advisories (weekly / manual only) ─────────────────────────
  # A newly published RustSec advisory shouldn't fail unrelated pushes, so this
  # only runs on the schedule (and by hand): `cargo audit` over Cargo.lock.
  audit:
    name: audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo.lock
        run: cargo audit
