name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true
        default: ""
      source:
        description: "Build from this ref instead of the tag (e.g. main), to re-publish a release with fixed CI. The workspace version must still match the tag."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  # Never cancel a release: a newer run would stop one mid-publish.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PUBLIC_OWNER: sorinirimies

jobs:
  # ── 0. Validate tag ──────────────────────────────────────────────────────────
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      # What every job checks out: the tag, or `source` when re-publishing.
      ref: ${{ github.event.inputs.source || steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Nushell
        run: |
          V=0.116.1
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o /tmp/nu.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/nu.tgz -C /tmp && break
            echo "nu download failed (attempt $attempt); retrying in 15s"; sleep 15
          done
          test -x /tmp/nu-$V-x86_64-unknown-linux-gnu/nu
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version
      - name: Resolve and validate tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          nu scripts/ci/validate_tag.nu "$TAG" --check-workspace >> "$GITHUB_OUTPUT"

  # ── 1. Quality gate ───────────────────────────────────────────────────────────
  test:
    name: Test & lint
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Nushell
        run: |
          V=0.116.1
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o /tmp/nu.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/nu.tgz -C /tmp && break
            echo "nu download failed (attempt $attempt); retrying in 15s"; sleep 15
          done
          test -x /tmp/nu-$V-x86_64-unknown-linux-gnu/nu
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version
      - name: Quality gate
        run: nu scripts/ci/quality_gate.nu

  # ── 2. mqtt-broker binary matrix ──────────────────────────────────────────────
  build-broker:
    name: Build mqtt-broker — ${{ matrix.name }}
    needs: [validate, test]
    runs-on: ${{ matrix.runner }}
    env:
      # macOS cross-target strip produced a correctly-sized all-zero file once;
      # package unstripped binaries and validate their executable magic below.
      CARGO_PROFILE_RELEASE_STRIP: none
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            suffix: ""
          - name: Linux aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            suffix: ""
          - name: macOS x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            cross: false
            suffix: ""
          - name: macOS aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            cross: false
            suffix: ""
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            suffix: ".exe"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release -p stem-mqtt-broker --bin mqtt-broker --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release -p stem-mqtt-broker --bin mqtt-broker --target ${{ matrix.target }}

      - name: Validate executable
        run: nu scripts/ci/validate_binary.nu "target/${{ matrix.target }}/release/mqtt-broker${{ matrix.suffix }}" "${{ matrix.target }}"

      - name: Package
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/mqtt-broker${{ matrix.suffix }}"
          out="mqtt-broker-${{ needs.validate.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$out"
          cp "$bin" "$out/"
          cp README.md LICENSE "$out/"
          if [ "${{ matrix.suffix }}" = ".exe" ]; then
            (cd "$(dirname "$out")" && 7z a "${out}.zip" "$(basename "$out")") 2>/dev/null || \
              powershell -Command "Compress-Archive -Path '$out' -DestinationPath '${out}.zip'"
          else
            tar czf "${out}.tar.gz" "$out"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: mqtt-broker-${{ matrix.target }}
          path: |
            mqtt-broker-*.tar.gz
            mqtt-broker-*.zip
          retention-days: 1

  # ── 3. mqtt-client native library (cdylib + staticlib), standalone ──────────
  # Same target matrix as mqtt-broker, but packages the client's compiled
  # native library directly (for direct FFI/C/C++ consumption, or as a
  # starting point for a binding generator this repo doesn't ship yet) —
  # independent of any single language's packaging job below.
  build-client:
    name: Build mqtt-client — ${{ matrix.name }}
    needs: [validate, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            ext: so
          - name: Linux aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            ext: so
          - name: macOS x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            cross: false
            ext: dylib
          - name: macOS aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            cross: false
            ext: dylib
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            ext: dll
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: client-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo rustc --release -p stem-mqtt-client --lib --crate-type cdylib,staticlib --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross rustc --release -p stem-mqtt-client --lib --crate-type cdylib,staticlib --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          out="mqtt-client-${{ needs.validate.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$out"
          libdir="target/${{ matrix.target }}/release"
          # Static lib is `.a` everywhere except MSVC, which names it `.lib`.
          if [ "${{ matrix.ext }}" = "dll" ]; then
            cp "$libdir/mqtt_client.dll" "$out/" 2>/dev/null || true
            cp "$libdir/mqtt_client.dll.lib" "$out/" 2>/dev/null || true
            cp "$libdir/mqtt_client.lib" "$out/" 2>/dev/null || true
          else
            cp "$libdir/libmqtt_client.${{ matrix.ext }}" "$out/"
            cp "$libdir/libmqtt_client.a" "$out/" 2>/dev/null || true
          fi
          cp crates/mqtt-client/README.md LICENSE "$out/"
          if [ "${{ matrix.ext }}" = "dll" ]; then
            powershell -Command "Compress-Archive -Path '$out' -DestinationPath '${out}.zip'" || \
              (cd "$(dirname "$out")" && 7z a "${out}.zip" "$(basename "$out")")
          else
            tar czf "${out}.tar.gz" "$out"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: mqtt-client-${{ matrix.target }}
          path: |
            mqtt-client-*.tar.gz
            mqtt-client-*.zip
          retention-days: 1

  # ── 3b. Precompiled NIFs for the stem_mqtt Hex package (crates/mqtt-beam) ─────
  # Named as RustlerPrecompiled expects; attached to the release by the release job
  # and never pruned (old Hex versions download from their own release).
  build-nif:
    name: Build NIF — ${{ matrix.target }}
    needs: [validate, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, cross: false, lib: libstem_mqtt_nif.so, final: libstem_mqtt_nif, ext: so }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: true, lib: libstem_mqtt_nif.so, final: libstem_mqtt_nif, ext: so }
          - { runner: macos-latest, target: x86_64-apple-darwin, cross: false, lib: libstem_mqtt_nif.dylib, final: libstem_mqtt_nif, ext: so }
          - { runner: macos-latest, target: aarch64-apple-darwin, cross: false, lib: libstem_mqtt_nif.dylib, final: libstem_mqtt_nif, ext: so }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, cross: false, lib: stem_mqtt_nif.dll, final: stem_mqtt_nif, ext: dll }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: nif-${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release -p stem_mqtt_nif --target ${{ matrix.target }}
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release -p stem_mqtt_nif --target ${{ matrix.target }}
      # <lib>-v<version>-nif-2.15-<target>.<so|dll>.tar.gz; macOS NIFs end in .so too.
      - name: Package
        shell: bash
        run: |
          name="${{ matrix.final }}-v${{ needs.validate.outputs.version }}-nif-2.15-${{ matrix.target }}.${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "$name"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: nif-${{ matrix.target }}
          path: "*stem_mqtt_nif-v*.tar.gz"
          retention-days: 1

  # ── 4. UniFFI source bindings (official backends) ────────────────────────────
  bindings:
    name: UniFFI bindings — ${{ matrix.language }}
    needs: [validate, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [kotlin, swift, python]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Nushell
        run: |
          V=0.116.1
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o /tmp/nu.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/nu.tgz -C /tmp && break
            echo "nu download failed (attempt $attempt); retrying in 15s"; sleep 15
          done
          test -x /tmp/nu-$V-x86_64-unknown-linux-gnu/nu
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version

      - name: Generate bindings (mqtt-client)
        run: nu scripts/generate_bindings.nu ${{ matrix.language }} mqtt-client

      - name: Generate bindings (mqtt-broker)
        run: nu scripts/generate_bindings.nu ${{ matrix.language }} mqtt-broker

      - name: Validate and zip bindings
        run: |
          set -euo pipefail
          root="bindings/${{ matrix.language }}"
          for crate in mqtt-client mqtt-broker; do
            count="$(find "$root/$crate" -type f | wc -l | tr -d ' ')"
            if [ "$count" -eq 0 ]; then
              echo "error: generated ${{ matrix.language }} bindings for $crate are empty" >&2
              exit 1
            fi
          done
          zip -qr "bindings-${{ matrix.language }}.zip" "$root"
          unzip -t "bindings-${{ matrix.language }}.zip" >/dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.language }}
          path: bindings-${{ matrix.language }}.zip
          if-no-files-found: error
          retention-days: 1

  # ── 5. Python wheels (client + broker, desktop platforms) ─────────────────────
  build-python:
    name: Build Python — ${{ matrix.crate }} / ${{ matrix.runner }}
    needs: [validate, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
        crate: [mqtt-client, mqtt-broker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        run: maturin build --release --manifest-path crates/${{ matrix.crate }}/Cargo.toml

      - uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.crate }}-${{ matrix.runner }}
          path: target/wheels/*.whl
          if-no-files-found: error
          retention-days: 1

  test-python:
    name: Test Python wheels — ${{ matrix.runner }}
    needs: [validate, build-python]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: wheels
          merge-multiple: true

      - name: Install matching client + broker wheels
        run: >-
          python -m pip install --no-index --find-links wheels
          stem-mqtt-client==${{ needs.validate.outputs.version }}
          stem-mqtt-broker==${{ needs.validate.outputs.version }}

      - name: Run client/broker round-trip
        run: python packaging/python/smoke_test.py

  # ── 6. Kotlin JVM + Android packages (client + broker) ────────────────────────
  build-kotlin:
    name: Build Kotlin packages
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform 34 + build-tools are installed
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Nushell
        run: |
          V=0.116.1
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o /tmp/nu.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/nu.tgz -C /tmp && break
            echo "nu download failed (attempt $attempt); retrying in 15s"; sleep 15
          done
          test -x /tmp/nu-$V-x86_64-unknown-linux-gnu/nu
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version

      - name: Generate and stage client + broker
        run: |
          nu scripts/generate_bindings.nu kotlin mqtt-client
          nu scripts/generate_bindings.nu kotlin mqtt-broker
          ./packaging/kotlin/stage.sh ${{ needs.validate.outputs.version }}
          ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }} ./packaging/kotlin/stage-android.sh

      - name: Build JVM jar
        working-directory: packaging/kotlin
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: gradle clean build --no-daemon

      - name: Build Android AAR
        working-directory: packaging/kotlin/android
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: gradle clean assembleRelease --no-daemon

      - name: Validate and stage publication inputs
        run: |
          set -euo pipefail
          jar_path="packaging/kotlin/build/libs/stem-mqtt-kotlin-${{ needs.validate.outputs.version }}.jar"
          aar_path="packaging/kotlin/android/build/outputs/aar/stem-mqtt-kotlin-android-release.aar"
          jar tf "$jar_path" > kotlin-jar-files.txt
          grep -q 'uniffi/mqtt_client/MqttClient.class' kotlin-jar-files.txt
          grep -q 'uniffi/mqtt_broker/MqttBroker.class' kotlin-jar-files.txt
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -p "$aar_path" "jni/$abi/libmqtt_client.so" >/dev/null
            unzip -p "$aar_path" "jni/$abi/libmqtt_broker.so" >/dev/null
          done
          tar czf kotlin-publish-inputs.tar.gz \
            packaging/kotlin/staged \
            packaging/kotlin/android/staged-jniLibs
          cp "$jar_path" .
          cp "$aar_path" stem-mqtt-android-${{ needs.validate.outputs.version }}.aar

      - uses: actions/upload-artifact@v7
        with:
          name: kotlin-packages
          path: |
            kotlin-publish-inputs.tar.gz
            stem-mqtt-kotlin-*.jar
            stem-mqtt-android-*.aar
          if-no-files-found: error
          retention-days: 1

  # ── 7. GitHub Release ──────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [validate, build-broker, build-client, build-nif, bindings, build-python, test-python, build-kotlin, build-swift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - name: Install git-cliff
        run: cargo install git-cliff --locked
      - name: Install Nushell
        run: |
          V=0.116.1
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o /tmp/nu.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/nu.tgz -C /tmp && break
            echo "nu download failed (attempt $attempt); retrying in 15s"; sleep 15
          done
          test -x /tmp/nu-$V-x86_64-unknown-linux-gnu/nu
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version
      - name: Generate release notes
        run: nu scripts/ci/release_notes.nu ${{ needs.validate.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*
            LICENSE
            README.md
            CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep binaries only on the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: nu scripts/ci/prune_releases.nu ${{ needs.validate.outputs.tag }}

  # ── 8. Publish to crates.io ────────────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: [validate, release]
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CRATES_IO_TOKEN != '' }}
    steps:
      - name: Skip (no token)
        if: env.HAS_TOKEN != 'true'
        run: echo "⏭️  CRATES_IO_TOKEN not set — skipping."

      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_TOKEN == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_TOKEN == 'true'
      - name: Install Nushell
        if: env.HAS_TOKEN == 'true'
        run: |
          V=0.116.1
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o /tmp/nu.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/nu.tgz -C /tmp && break
            echo "nu download failed (attempt $attempt); retrying in 15s"; sleep 15
          done
          test -x /tmp/nu-$V-x86_64-unknown-linux-gnu/nu
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version

      - name: Publish mqtt-client (must go first — mqtt-broker depends on it)
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: nu scripts/ci/publish_crate.nu stem-mqtt-client ${{ needs.validate.outputs.version }} --readme-dir crates/mqtt-client --wait 30

      - name: Publish mqtt-broker
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: nu scripts/ci/publish_crate.nu stem-mqtt-broker ${{ needs.validate.outputs.version }} --readme-dir crates/mqtt-broker --wait 0

  # ── 8b. Publish stem_mqtt to Hex (GitHub only: the NIFs are downloaded from here) ─
  publish-hex:
    name: Publish to Hex
    needs: [validate, release]
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.ELIXIR_HEX_TOKEN != '' }}
    steps:
      - name: Skip (no token)
        if: env.HAS_TOKEN != 'true'
        run: echo "⏭️  ELIXIR_HEX_TOKEN not set — skipping."
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_TOKEN == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_TOKEN == 'true'
      - name: Install Nushell
        if: env.HAS_TOKEN == 'true'
        run: |
          V=0.116.1
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o /tmp/nu.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/nu.tgz -C /tmp && break
            echo "nu download failed (attempt $attempt); retrying in 15s"; sleep 15
          done
          test -x /tmp/nu-$V-x86_64-unknown-linux-gnu/nu
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version
      - uses: erlef/setup-beam@v1
        if: env.HAS_TOKEN == 'true'
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: Checksum the release NIFs, test against them, publish
        if: env.HAS_TOKEN == 'true'
        env:
          HEX_API_KEY: ${{ secrets.ELIXIR_HEX_TOKEN }}
        run: nu scripts/ci/elixir.nu publish ${{ needs.validate.outputs.version }}

  # ── 8c. Ruby gems: one per crate per platform, each with only its own library ──
  # After the release on purpose: the release job attaches every artifact that
  # exists when it runs, and the gems are not release assets.
  # Both native libraries for every target, once per UniFFI release a packaged binding needs
  # (native-libs.yml). After `release`: its artifacts are not release assets.
  build-native-libs:
    needs: [validate, release]
    uses: ./.github/workflows/native-libs.yml
    with:
      ref: ${{ needs.validate.outputs.ref }}

  publish-ruby:
    name: Publish Ruby gems
    needs: [validate, build-native-libs]
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.RUBY_GEM_TOKEN != '' }}
    steps:
      - name: Skip (no token)
        if: env.HAS_TOKEN != 'true'
        run: echo "⏭️  RUBY_GEM_TOKEN not set — skipping."
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_TOKEN == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_TOKEN == 'true'
      - name: Install Nushell
        if: env.HAS_TOKEN == 'true'
        run: |
          V=0.116.1
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o /tmp/nu.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/nu.tgz -C /tmp && break
            echo "nu download failed (attempt $attempt); retrying in 15s"; sleep 15
          done
          test -x /tmp/nu-$V-x86_64-unknown-linux-gnu/nu
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version
      - uses: ruby/setup-ruby@v1
        if: env.HAS_TOKEN == 'true'
        with:
          ruby-version: "3.4"
      - uses: actions/download-artifact@v8
        if: env.HAS_TOKEN == 'true'
        with:
          pattern: native-workspace-*
          path: native-libs/
          merge-multiple: true
      - name: Build the gems (Ruby code generated once; it is the same on every platform)
        if: env.HAS_TOKEN == 'true'
        run: nu scripts/ci/ruby_gem.nu release ${{ needs.validate.outputs.version }} native-libs/workspace gems
      - name: Push the gems
        if: env.HAS_TOKEN == 'true'
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBY_GEM_TOKEN }}
        run: nu scripts/ci/ruby_gem.nu publish gems

  # ── 9. Publish Python wheels to PyPI ───────────────────────────────────────────
  publish-python:
    name: Publish to PyPI
    needs: [validate, release]
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI trusts this workflow + environment, no token needed.
    # Each project (stem-mqtt-client, stem-mqtt-broker) lists it as a publisher.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download client wheels
        uses: actions/download-artifact@v8
        with:
          pattern: python-mqtt-client-*
          path: dist/client
          merge-multiple: true

      - name: Download broker wheels
        uses: actions/download-artifact@v8
        with:
          pattern: python-mqtt-broker-*
          path: dist/broker
          merge-multiple: true

      - name: Publish stem-mqtt-client
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/client
          skip-existing: true

      - name: Publish stem-mqtt-broker
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/broker
          skip-existing: true

  # ── 10. Publish verified Kotlin packages to GitHub Packages ──────────────────
  publish-kotlin:
    name: Publish Kotlin packages
    needs: [validate, build-kotlin, release]
    runs-on: ubuntu-latest
    env:
      # Maven Central needs SONATYPE_TOKEN (the Portal's settings.xml snippet, pasted as is)
      # or MAVEN_CENTRAL_USERNAME + MAVEN_CENTRAL_PASSWORD, plus SIGNING_KEY / SIGNING_PASSWORD.
      HAS_CENTRAL: ${{ secrets.SONATYPE_TOKEN != '' || secrets.MAVEN_CENTRAL_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform 34 + build-tools are installed
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - uses: actions/download-artifact@v8
        with:
          name: kotlin-packages
          path: .

      - name: Restore verified publication inputs
        run: tar xzf kotlin-publish-inputs.tar.gz

      # Nushell first: every publish runs through scripts/ci/publish_once.nu.
      - name: Install Rust (for Nushell)
        uses: dtolnay/rust-toolchain@stable
      - name: Install Nushell
        run: |
          V=0.116.1
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o /tmp/nu.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/nu.tgz -C /tmp && break
            echo "nu download failed (attempt $attempt); retrying in 15s"; sleep 15
          done
          test -x /tmp/nu-$V-x86_64-unknown-linux-gnu/nu
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version
      - name: Publish Kotlin/JVM package to GitHub Packages
        working-directory: packaging/kotlin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        # Only to Packages: plain `publish` also fills the staging repository with
        # unsigned artifacts that Maven Central then rejects.
        run: nu ../../scripts/ci/publish_once.nu gradle publishAllPublicationsToPackagesRepository --no-daemon

      - name: Publish Kotlin/Android AAR to GitHub Packages
        working-directory: packaging/kotlin/android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: nu ../../../scripts/ci/publish_once.nu gradle publish --no-daemon

      # Maven Central takes a signed bundle of the Maven repository layout (Central Portal),
      # built and uploaded by the same Nushell script the Gitea release uses.
      # Needs the verified namespace io.github.<owner>.
      - name: Publish Kotlin/JVM package to Maven Central
        if: env.HAS_CENTRAL == 'true'
        working-directory: packaging/kotlin
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          rm -rf build/staging-repo
          gradle publishAllPublicationsToStagingRepository --no-daemon -PgroupId="io.github.${OWNER}.stemmqtt"
          nu ../../scripts/publish_maven_central.nu build/staging-repo "stem-mqtt-kotlin-${PACKAGE_VERSION}"

  # ── 10b. Third-party language packages → GitHub Packages ──────────────────────
  # GitHub Packages hosts Maven, npm, NuGet and containers; Go, Dart, Haskell
  # travel as OCI artifacts on ghcr.io. All driven by
  # scripts/publish_packages.nu (registry table: scripts/bindings/spec.nu).
  # `stage` runs per OS so each native library is built on its own platform;
  # `publish-github-packages` merges every platform and publishes once.
  stage-packages:
    name: Stage ${{ matrix.language }} — ${{ matrix.runner }}
    needs: [validate, test]
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
        language: [java, csharp, go]
        experimental: [false]
        include:
          - { runner: ubuntu-latest, language: dart, experimental: true }
          - { runner: ubuntu-latest, language: node, experimental: true }
          - { runner: ubuntu-latest, language: haskell, experimental: true }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Nushell (Linux prebuilt)
        if: runner.os == 'Linux'
        run: |
          V=0.116.1
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o /tmp/nu.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/nu.tgz -C /tmp && break
            echo "nu download failed (attempt $attempt); retrying in 15s"; sleep 15
          done
          test -x /tmp/nu-$V-x86_64-unknown-linux-gnu/nu
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version
      - name: Install Nushell (build)
        if: runner.os != 'Linux'
        run: cargo install nu --locked
      # The runner has Java, Node, .NET and Go; the Dart SDK the runtime test needs it lacks.
      - name: Install Dart
        if: matrix.language == 'dart'
        uses: dart-lang/setup-dart@v1
      - name: Install the ${{ matrix.language }} generator
        run: nu scripts/install_bindgens.nu ${{ matrix.language }}
      - name: Runtime-test the generated bindings before packaging them
        if: matrix.runner == 'ubuntu-latest'
        run: nu scripts/test_bindings.nu ${{ matrix.language }} --strict
      - name: Stage ${{ matrix.language }} package
        run: nu scripts/publish_packages.nu stage ${{ matrix.language }}
      - uses: actions/upload-artifact@v7
        with:
          name: stage-${{ matrix.language }}-${{ matrix.runner }}
          path: dist/${{ matrix.language }}
          if-no-files-found: error
          retention-days: 1

  publish-github-packages:
    name: Publish ${{ matrix.language }} to GitHub Packages
    needs: [validate, stage-packages, release, build-native-libs]
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: java, experimental: false }
          - { language: csharp, experimental: false }
          - { language: go, experimental: false }
          - { language: dart, experimental: true }
          - { language: node, experimental: true }
          - { language: haskell, experimental: true }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Nushell
        run: |
          V=0.116.1
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o /tmp/nu.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/nu.tgz -C /tmp && break
            echo "nu download failed (attempt $attempt); retrying in 15s"; sleep 15
          done
          test -x /tmp/nu-$V-x86_64-unknown-linux-gnu/nu
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version

      # Merge every platform's staged native libraries into one tree.
      - uses: actions/download-artifact@v8
        with:
          pattern: stage-${{ matrix.language }}-*
          path: staged
          merge-multiple: true
      - name: Place staged package under dist/
        run: mkdir -p dist && mv staged dist/${{ matrix.language }}
      # Every platform's libraries: npm and Maven ship one package per platform.
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native-libs/
          merge-multiple: true

      - uses: actions/setup-node@v7
        if: matrix.language == 'node'
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
          scope: "@${{ github.repository_owner }}"
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v6
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "22"
      - uses: gradle/actions/setup-gradle@v6
        if: matrix.language == 'java'
      - uses: oras-project/setup-oras@v1
        if: matrix.language != 'java' && matrix.language != 'csharp' && matrix.language != 'node'
      - name: Log in to ghcr.io
        if: matrix.language != 'java' && matrix.language != 'csharp' && matrix.language != 'node'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish ${{ matrix.language }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          nu scripts/publish_packages.nu publish ${{ matrix.language }}
          ${{ needs.validate.outputs.version }}
          --owner ${{ github.repository_owner }}
          --natives native-libs

  # ── 11. Build Swift client+broker package archive ─────────────────────────────
  build-swift:
    name: Build Swift package
    needs: [validate, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      # build_xcframework.sh generates the Swift bindings with nu.
      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"

      - name: Build and verify client + broker Swift package
        run: ./packaging/swift/build_xcframework.sh ${{ needs.validate.outputs.version }}

      - name: Upload Swift package artifact
        uses: actions/upload-artifact@v7
        with:
          name: stem-mqtt-swift
          path: packaging/swift/dist/StemMqttSwift-*.zip
          if-no-files-found: error

  # ── Public registries ────────────────────────────────────────────────────────
  # npmjs.org, NuGet.org, Maven Central (Java), Hackage and the Go module repository. Each
  # language needs its own secret and is skipped quietly without it:
  #   node     NPM_TOKEN (npm granular access token, publish rights, "bypass 2FA") — package `stem-mqtt`
  #   csharp   NUGET_API_KEY
  #   java     SONATYPE_TOKEN (or MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD) / SIGNING_KEY / SIGNING_PASSWORD
  #   haskell  HACKAGE_TOKEN
  #   go       GO_MODULE_TOKEN (push access to github.com/<owner>/stem-mqtt-go)
  # Kotlin → Maven Central and Python → PyPI are in their own jobs above; pub.dev is
  # published from GitHub Actions (.github/workflows/publish-pubdev.yml) because pub.dev only
  # trusts that CI.
  publish-public:
    name: Publish ${{ matrix.language }} (public registry)
    needs: [validate, release, build-native-libs]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        language: [node, csharp, java, haskell, go]
    env:
      HAS_TOKEN: ${{ (matrix.language == 'node' && secrets.NPM_TOKEN != '') || (matrix.language == 'csharp' && secrets.NUGET_API_KEY != '') || (matrix.language == 'java' && (secrets.MAVEN_CENTRAL_PASSWORD != '' || secrets.SONATYPE_TOKEN != '')) || (matrix.language == 'haskell' && secrets.HACKAGE_TOKEN != '') || (matrix.language == 'go' && secrets.GO_MODULE_TOKEN != '') }}
    steps:
      - name: Skip (no token)
        if: env.HAS_TOKEN != 'true'
        run: echo "⏭️  no registry token for ${{ matrix.language }} — skipping its public package."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - name: Install Rust stable
        if: env.HAS_TOKEN == 'true'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          for attempt in 1 2 3 4 5; do
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal && break
            echo "rustup install failed (attempt $attempt); retrying in 20s"; sleep 20
          done
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_TOKEN == 'true'
      - name: Install Nushell
        if: env.HAS_TOKEN == 'true'
        run: |
          V=0.116.1
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o /tmp/nu.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/nu.tgz -C /tmp && break
            echo "nu download failed (attempt $attempt); retrying in 15s"; sleep 15
          done
          test -x /tmp/nu-$V-x86_64-unknown-linux-gnu/nu
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version

      - uses: actions/setup-dotnet@v4
        if: env.HAS_TOKEN == 'true' && matrix.language == 'csharp'
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v6
        if: env.HAS_TOKEN == 'true' && matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "22"
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true' && matrix.language == 'node'
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: haskell-actions/setup@v2
        if: env.HAS_TOKEN == 'true' && matrix.language == 'haskell'
      - uses: actions/setup-go@v5
        if: env.HAS_TOKEN == 'true' && matrix.language == 'go'
        with:
          go-version: "stable"
      - name: Install Gradle + zip
        if: env.HAS_TOKEN == 'true' && matrix.language == 'java'
        run: |
          (command -v unzip >/dev/null && command -v zip >/dev/null) || sudo apt-get install -y -qq unzip zip
          curl -fsSL --retry 5 --retry-delay 10 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          mkdir -p "$HOME/gradle" && unzip -q -o /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.14.3/bin" >> $GITHUB_PATH

      - name: Restore generator cache
        if: env.HAS_TOKEN == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bindgens
          key: bindgens-${{ matrix.language }}-${{ hashFiles('scripts/bindings/spec.nu', 'packaging/haskell/uniffi-bindgen-haskell.patch') }}
      - name: Install the generator
        if: env.HAS_TOKEN == 'true'
        run: |
          echo "$HOME/.bindgens/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bindgens/bin:$PATH"
          nu scripts/install_bindgens.nu ${{ matrix.language }} --root "$HOME/.bindgens"

      - name: Runtime-test the bindings before publishing them
        if: env.HAS_TOKEN == 'true'
        run: nu scripts/test_bindings.nu ${{ matrix.language }} --strict
      - name: Stage ${{ matrix.language }}
        if: env.HAS_TOKEN == 'true'
        run: nu scripts/publish_packages.nu stage ${{ matrix.language }}
      - uses: actions/download-artifact@v8
        if: env.HAS_TOKEN == 'true'
        with:
          pattern: native-*
          path: native-libs/
          merge-multiple: true

      - name: Publish ${{ matrix.language }}
        if: env.HAS_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
          GO_MODULE_TOKEN: ${{ secrets.GO_MODULE_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: >
          nu scripts/publish_packages.nu publish ${{ matrix.language }}
          ${{ needs.validate.outputs.version }}
          --target public
          --owner ${{ env.PUBLIC_OWNER }}
          --natives native-libs
