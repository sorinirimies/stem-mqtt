name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 0. Validate tag ──────────────────────────────────────────────────────────
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Nushell
        run: cargo install nu --locked
      - name: Resolve and validate tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          nu scripts/ci/validate_tag.nu "$TAG" --check-workspace >> "$GITHUB_OUTPUT"

  # ── 1. Quality gate ───────────────────────────────────────────────────────────
  test:
    name: Test & lint
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Nushell
        run: cargo install nu --locked
      - name: Quality gate
        run: nu scripts/ci/quality_gate.nu

  # ── 2. mqtt-broker binary matrix ──────────────────────────────────────────────
  build-broker:
    name: Build mqtt-broker — ${{ matrix.name }}
    needs: [validate, test]
    runs-on: ${{ matrix.runner }}
    env:
      # macOS cross-target strip produced a correctly-sized all-zero file once;
      # package unstripped binaries and validate their executable magic below.
      CARGO_PROFILE_RELEASE_STRIP: none
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            suffix: ""
          - name: Linux aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            suffix: ""
          - name: macOS x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            cross: false
            suffix: ""
          - name: macOS aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            cross: false
            suffix: ""
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            suffix: ".exe"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release -p stem-mqtt-broker --bin mqtt-broker --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release -p stem-mqtt-broker --bin mqtt-broker --target ${{ matrix.target }}

      - name: Validate executable
        shell: bash
        run: python scripts/ci/validate_binary.py "target/${{ matrix.target }}/release/mqtt-broker${{ matrix.suffix }}" "${{ matrix.target }}"

      - name: Package
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/mqtt-broker${{ matrix.suffix }}"
          out="mqtt-broker-${{ needs.validate.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$out"
          cp "$bin" "$out/"
          cp README.md LICENSE "$out/"
          if [ "${{ matrix.suffix }}" = ".exe" ]; then
            (cd "$(dirname "$out")" && 7z a "${out}.zip" "$(basename "$out")") 2>/dev/null || \
              powershell -Command "Compress-Archive -Path '$out' -DestinationPath '${out}.zip'"
          else
            tar czf "${out}.tar.gz" "$out"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-broker-${{ matrix.target }}
          path: |
            mqtt-broker-*.tar.gz
            mqtt-broker-*.zip
          retention-days: 1

  # ── 3. mqtt-client native library (cdylib + staticlib), standalone ──────────
  # Same target matrix as mqtt-broker, but packages the client's compiled
  # native library directly (for direct FFI/C/C++ consumption, or as a
  # starting point for a binding generator this repo doesn't ship yet) —
  # independent of any single language's packaging job below.
  build-client:
    name: Build mqtt-client — ${{ matrix.name }}
    needs: [validate, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            ext: so
          - name: Linux aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            ext: so
          - name: macOS x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            cross: false
            ext: dylib
          - name: macOS aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            cross: false
            ext: dylib
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            ext: dll
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: client-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release -p stem-mqtt-client --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release -p stem-mqtt-client --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          out="mqtt-client-${{ needs.validate.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$out"
          libdir="target/${{ matrix.target }}/release"
          # Static lib is `.a` everywhere except MSVC, which names it `.lib`.
          if [ "${{ matrix.ext }}" = "dll" ]; then
            cp "$libdir/mqtt_client.dll" "$out/" 2>/dev/null || true
            cp "$libdir/mqtt_client.dll.lib" "$out/" 2>/dev/null || true
            cp "$libdir/mqtt_client.lib" "$out/" 2>/dev/null || true
          else
            cp "$libdir/libmqtt_client.${{ matrix.ext }}" "$out/"
            cp "$libdir/libmqtt_client.a" "$out/" 2>/dev/null || true
          fi
          cp crates/mqtt-client/README.md LICENSE "$out/"
          if [ "${{ matrix.ext }}" = "dll" ]; then
            powershell -Command "Compress-Archive -Path '$out' -DestinationPath '${out}.zip'" || \
              (cd "$(dirname "$out")" && 7z a "${out}.zip" "$(basename "$out")")
          else
            tar czf "${out}.tar.gz" "$out"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-client-${{ matrix.target }}
          path: |
            mqtt-client-*.tar.gz
            mqtt-client-*.zip
          retention-days: 1

  # ── 4. UniFFI source bindings (official backends) ────────────────────────────
  bindings:
    name: UniFFI bindings — ${{ matrix.language }}
    needs: [validate, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [kotlin, swift, python]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Nushell
        run: cargo install nu --locked

      - name: Generate bindings (mqtt-client)
        run: nu scripts/generate_bindings.nu ${{ matrix.language }} mqtt-client

      - name: Generate bindings (mqtt-broker)
        run: nu scripts/generate_bindings.nu ${{ matrix.language }} mqtt-broker

      - name: Validate and zip bindings
        run: |
          set -euo pipefail
          root="bindings/${{ matrix.language }}"
          for crate in mqtt-client mqtt-broker; do
            count="$(find "$root/$crate" -type f | wc -l | tr -d ' ')"
            if [ "$count" -eq 0 ]; then
              echo "error: generated ${{ matrix.language }} bindings for $crate are empty" >&2
              exit 1
            fi
          done
          zip -qr "bindings-${{ matrix.language }}.zip" "$root"
          unzip -t "bindings-${{ matrix.language }}.zip" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.language }}
          path: bindings-${{ matrix.language }}.zip
          if-no-files-found: error
          retention-days: 1

  # ── 5. Python wheels (client + broker, desktop platforms) ─────────────────────
  build-python:
    name: Build Python — ${{ matrix.crate }} / ${{ matrix.runner }}
    needs: [validate, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
        crate: [mqtt-client, mqtt-broker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        run: maturin build --release --manifest-path crates/${{ matrix.crate }}/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.crate }}-${{ matrix.runner }}
          path: target/wheels/*.whl
          if-no-files-found: error
          retention-days: 1

  test-python:
    name: Test Python wheels — ${{ matrix.runner }}
    needs: [validate, build-python]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: wheels
          merge-multiple: true

      - name: Install matching client + broker wheels
        run: >-
          python -m pip install --no-index --find-links wheels
          stem-mqtt-client==${{ needs.validate.outputs.version }}
          stem-mqtt-broker==${{ needs.validate.outputs.version }}

      - name: Run client/broker round-trip
        run: python packaging/python/smoke_test.py

  # ── 6. Kotlin JVM + Android packages (client + broker) ────────────────────────
  build-kotlin:
    name: Build Kotlin packages
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform 34 + build-tools are installed
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Nushell
        run: cargo install nu --locked

      - name: Generate and stage client + broker
        run: |
          nu scripts/generate_bindings.nu kotlin mqtt-client
          nu scripts/generate_bindings.nu kotlin mqtt-broker
          ./packaging/kotlin/stage.sh ${{ needs.validate.outputs.version }}
          ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }} ./packaging/kotlin/stage-android.sh

      - name: Build JVM jar
        working-directory: packaging/kotlin
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: gradle clean build --no-daemon

      - name: Build Android AAR
        working-directory: packaging/kotlin/android
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: gradle clean assembleRelease --no-daemon

      - name: Validate and stage publication inputs
        run: |
          set -euo pipefail
          jar_path="packaging/kotlin/build/libs/stem-mqtt-kotlin-${{ needs.validate.outputs.version }}.jar"
          aar_path="packaging/kotlin/android/build/outputs/aar/stem-mqtt-kotlin-android-release.aar"
          jar tf "$jar_path" > kotlin-jar-files.txt
          grep -q 'uniffi/mqtt_client/MqttClient.class' kotlin-jar-files.txt
          grep -q 'uniffi/mqtt_broker/MqttBroker.class' kotlin-jar-files.txt
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -p "$aar_path" "jni/$abi/libmqtt_client.so" >/dev/null
            unzip -p "$aar_path" "jni/$abi/libmqtt_broker.so" >/dev/null
          done
          tar czf kotlin-publish-inputs.tar.gz \
            packaging/kotlin/staged \
            packaging/kotlin/android/staged-jniLibs
          cp "$jar_path" .
          cp "$aar_path" stem-mqtt-android-${{ needs.validate.outputs.version }}.aar

      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-packages
          path: |
            kotlin-publish-inputs.tar.gz
            stem-mqtt-kotlin-*.jar
            stem-mqtt-android-*.aar
          if-no-files-found: error
          retention-days: 1

  # ── 7. GitHub Release ──────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [validate, build-broker, build-client, bindings, build-python, test-python, build-kotlin, build-swift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - name: Install git-cliff
        run: cargo install git-cliff --locked
      - name: Install Nushell
        run: cargo install nu --locked
      - name: Generate release notes
        run: nu scripts/ci/release_notes.nu ${{ needs.validate.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*
            LICENSE
            README.md
            CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 8. Publish to crates.io ────────────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: [validate, release]
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CRATES_IO_TOKEN != '' }}
    steps:
      - name: Skip (no token)
        if: env.HAS_TOKEN != 'true'
        run: echo "⏭️  CRATES_IO_TOKEN not set — skipping."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_TOKEN == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_TOKEN == 'true'
      - name: Install Nushell
        if: env.HAS_TOKEN == 'true'
        run: cargo install nu --locked

      - name: Publish mqtt-client (must go first — mqtt-broker depends on it)
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: nu scripts/ci/publish_crate.nu stem-mqtt-client ${{ needs.validate.outputs.version }} --readme-dir crates/mqtt-client --wait 30

      - name: Publish mqtt-broker
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: nu scripts/ci/publish_crate.nu stem-mqtt-broker ${{ needs.validate.outputs.version }} --readme-dir crates/mqtt-broker --wait 0

  # ── 9. Publish Python wheels to PyPI ───────────────────────────────────────────
  publish-python:
    name: Publish to PyPI
    needs: [validate, release]
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - name: Skip (no token)
        if: env.HAS_TOKEN != 'true'
        run: echo "⏭️  PYPI_API_TOKEN not set — skipping. See packaging/python/README.md."

      - uses: actions/setup-python@v5
        if: env.HAS_TOKEN == 'true'
        with:
          python-version: "3.12"

      - name: Install maturin
        if: env.HAS_TOKEN == 'true'
        run: pip install maturin

      - uses: actions/download-artifact@v4
        if: env.HAS_TOKEN == 'true'
        with:
          pattern: python-*
          path: wheels
          merge-multiple: true

      - name: Publish verified wheels
        if: env.HAS_TOKEN == 'true'
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: maturin upload --skip-existing wheels/*.whl

  # ── 10. Publish verified Kotlin packages to GitHub Packages ──────────────────
  publish-kotlin:
    name: Publish Kotlin packages
    needs: [validate, build-kotlin, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform 34 + build-tools are installed
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: kotlin-packages
          path: .

      - name: Restore verified publication inputs
        run: tar xzf kotlin-publish-inputs.tar.gz

      - name: Publish Kotlin/JVM package to GitHub Packages
        working-directory: packaging/kotlin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: gradle publish --no-daemon

      - name: Publish Kotlin/Android AAR to GitHub Packages
        working-directory: packaging/kotlin/android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: gradle publish --no-daemon

  # ── 10b. Third-party language packages → GitHub Packages ──────────────────────
  # GitHub Packages hosts Maven, npm, NuGet and containers; Go, Dart, Haskell
  # travel as OCI artifacts on ghcr.io. All driven by
  # scripts/publish_packages.nu (registry table: scripts/bindings/spec.nu).
  # `stage` runs per OS so each native library is built on its own platform;
  # `publish-github-packages` merges every platform and publishes once.
  stage-packages:
    name: Stage ${{ matrix.language }} — ${{ matrix.runner }}
    needs: [validate, test]
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
        language: [java, csharp, go]
        experimental: [false]
        include:
          - { runner: ubuntu-latest, language: dart, experimental: true }
          - { runner: ubuntu-latest, language: node, experimental: true }
          - { runner: ubuntu-latest, language: haskell, experimental: true }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Nushell
        run: cargo install nu --locked
      - name: Install the ${{ matrix.language }} generator
        run: nu scripts/install_bindgens.nu ${{ matrix.language }}
      - name: Runtime-test the generated bindings before packaging them
        if: matrix.runner == 'ubuntu-latest'
        run: nu scripts/test_bindings.nu ${{ matrix.language }} --strict
      - name: Stage ${{ matrix.language }} package
        run: nu scripts/publish_packages.nu stage ${{ matrix.language }}
      - uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.language }}-${{ matrix.runner }}
          path: dist/${{ matrix.language }}
          if-no-files-found: error
          retention-days: 1

  publish-github-packages:
    name: Publish ${{ matrix.language }} to GitHub Packages
    needs: [validate, stage-packages, release]
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: java, experimental: false }
          - { language: csharp, experimental: false }
          - { language: go, experimental: false }
          - { language: dart, experimental: true }
          - { language: node, experimental: true }
          - { language: haskell, experimental: true }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Nushell
        run: cargo install nu --locked

      # Merge every platform's staged native libraries into one tree.
      - uses: actions/download-artifact@v4
        with:
          pattern: stage-${{ matrix.language }}-*
          path: staged
          merge-multiple: true
      - name: Place staged package under dist/
        run: mkdir -p dist && mv staged dist/${{ matrix.language }}

      - uses: actions/setup-node@v4
        if: matrix.language == 'node'
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
          scope: "@${{ github.repository_owner }}"
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "22"
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.language == 'java'
      - uses: oras-project/setup-oras@v1
        if: matrix.language != 'java' && matrix.language != 'csharp' && matrix.language != 'node'
      - name: Log in to ghcr.io
        if: matrix.language != 'java' && matrix.language != 'csharp' && matrix.language != 'node'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish ${{ matrix.language }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          nu scripts/publish_packages.nu publish ${{ matrix.language }}
          ${{ needs.validate.outputs.version }}
          --owner ${{ github.repository_owner }}

  # ── 11. Build Swift client+broker package archive ─────────────────────────────
  build-swift:
    name: Build Swift package
    needs: [validate, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Build and verify client + broker Swift package
        run: ./packaging/swift/build_xcframework.sh ${{ needs.validate.outputs.version }}

      - name: Upload Swift package artifact
        uses: actions/upload-artifact@v4
