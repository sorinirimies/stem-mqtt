# Publish the Dart bindings to pub.dev as `stem_mqtt`.
#
# pub.dev only accepts automated publishing from GitHub Actions (OpenID Connect; no API
# token exists), so this job lives here rather than in the Gitea release workflow.
#
# One-time setup on https://pub.dev/packages/stem_mqtt/admin (after a first manual
# `dart pub publish` of the package, which pub.dev requires to create it):
#   Automated publishing → enable GitHub Actions → repository <owner>/stem-mqtt,
#   tag pattern  v{{version}}
name: Publish to pub.dev

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the leading v)"
        required: true

jobs:
  publish:
    name: Publish stem_mqtt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # pub.dev authenticates this job through OIDC
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: dart-lang/setup-dart@v1
      - name: Install Nushell
        run: |
          V=0.116.1
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o /tmp/nu.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/nu.tgz -C /tmp && break
            echo "nu download failed (attempt $attempt); retrying in 15s"; sleep 15
          done
          test -x /tmp/nu-$V-x86_64-unknown-linux-gnu/nu
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu "$HOME/.cargo/bin/nu"
          nu --version
      - name: Install the Dart generator
        run: |
          echo "$HOME/.bindgens/bin" >> $GITHUB_PATH
          nu scripts/install_bindgens.nu dart --root "$HOME/.bindgens"
      - name: Resolve the version
        id: version
        run: nu -c "print $\"version=('${{ github.event.inputs.version || github.ref_name }}' | str replace --regex '^v' '')\"" >> "$GITHUB_OUTPUT"
      - name: Runtime-test the bindings
        run: nu scripts/test_bindings.nu dart --strict
      # Outside the checkout: dart pub honours the repo's .gitignore, which ignores dist/,
      # and would publish an empty package.
      - name: Stage the package
        run: nu scripts/publish_packages.nu stage dart --out "${{ runner.temp }}/dart"
      - name: Set the version
        run: nu scripts/publish_packages.nu publish dart ${{ steps.version.outputs.version }} --from "${{ runner.temp }}/dart" --target public --dry-run
      - name: Validate
        working-directory: ${{ runner.temp }}/dart/pub
        run: dart pub publish --dry-run
      - name: Publish
        run: nu scripts/publish_packages.nu publish dart ${{ steps.version.outputs.version }} --from "${{ runner.temp }}/dart" --target public
