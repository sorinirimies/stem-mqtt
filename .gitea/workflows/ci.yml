name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
  # Weekly: the third-party generators are community projects pinned in
  # scripts/bindings/spec.nu — a scheduled run surfaces upstream drift.
  schedule:
    - cron: "0 5 * * 1"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Formatting ────────────────────────────────────────────────────────────
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + rustfmt
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          . "$HOME/.cargo/env"
          rustup component add rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting (workspace)
        run: cargo fmt --all -- --check

  # ── 2. Clippy ────────────────────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + clippy
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          . "$HOME/.cargo/env"
          rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy (workspace)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── 3. Tests ─────────────────────────────────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      - name: Generate lockfile (if absent)
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile

      - name: cargo test --workspace
        run: cargo test --workspace --all-features --all-targets

  # ── 4. Build (dev) ───────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      - name: Build mqtt-client (dev)
        run: cargo build -p stem-mqtt-client

      - name: Build mqtt-broker (dev)
        run: cargo build -p stem-mqtt-broker

      - name: Build every example
        run: cargo build --workspace --examples

  # ── 5. Docs ──────────────────────────────────────────────────────────────────
  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      - name: cargo doc (mqtt-client)
        run: cargo doc --no-deps -p stem-mqtt-client --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

      - name: cargo doc (mqtt-broker)
        run: cargo doc --no-deps -p stem-mqtt-broker --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  # ── 6. Nu script tests ───────────────────────────────────────────────────────
  test-nu:
    name: test-nu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      - name: Generate lockfile (if absent)
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile

      - name: Install Nushell
        run: cargo install nu --locked

      - name: Run Nu script tests
        run: nu scripts/tests/run_all.nu

  # ── 7. Do the generated bindings actually WORK? ──────────────────────────────
  # One job per language: generates the bindings, stages a scratch project with
  # tests/bindings/<language>/ and runs a real broker + clients through it
  # (scripts/test_bindings.nu, scenario described in its header). Languages with
  # a known upstream generator bug run as XFAIL and go red (XPASS) once fixed.
  test-bindings-runtime:
    name: runtime-${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        language: [python, go, csharp, java, dart, node, node-livekit, haskell]
    steps:
      - uses: actions/checkout@v4

      # Retried: static.rust-lang.org is intermittently unreachable from the runner,
      # and the binding jobs all start at once. `minimal` skips rustfmt/clippy/docs
      # (these jobs only compile), which also means far fewer downloads to fail.
      - name: Install Rust stable
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          for attempt in 1 2 3 4 5; do
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal && break
            echo "rustup install failed (attempt $attempt); retrying in 20s"; sleep 20
          done
          command -v cargo >/dev/null || { echo "rustup could not be installed"; exit 1; }
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      - name: Install Nushell
        run: cargo install nu --locked

      - uses: actions/setup-python@v5
        if: matrix.language == 'python'
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: stable
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "22"
      - uses: dart-lang/setup-dart@v1
        if: matrix.language == 'dart'
      - uses: actions/setup-node@v4
        if: matrix.language == 'node' || matrix.language == 'node-livekit'
        with:
          node-version: "22"
      - uses: haskell-actions/setup@v2
        if: matrix.language == 'haskell'

      - name: Install the generator
        if: matrix.language != 'python'
        run: nu scripts/install_bindgens.nu ${{ matrix.language }}

      - name: Runtime-test ${{ matrix.language }}
        run: nu scripts/test_bindings.nu ${{ matrix.language }} --strict

  # ── 8. Kotlin: packaged bindings + the Gradle smoke test ─────────────────────
  test-kotlin-runtime:
    name: runtime-kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Retried: static.rust-lang.org is intermittently unreachable from the runner,
      # and the binding jobs all start at once. `minimal` skips rustfmt/clippy/docs
      # (these jobs only compile), which also means far fewer downloads to fail.
      - name: Install Rust stable
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          for attempt in 1 2 3 4 5; do
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal && break
            echo "rustup install failed (attempt $attempt); retrying in 20s"; sleep 20
          done
          command -v cargo >/dev/null || { echo "rustup could not be installed"; exit 1; }
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      - name: Install Nushell
        run: cargo install nu --locked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # gradle/actions/setup-gradle can't be resolved by this Gitea ("Unable to resolve
      # v4: unsupported object type" at job setup — it fails every job that references it,
      # even behind an `if:`), so install Gradle directly.
      - name: Install Gradle
        run: |
          (command -v unzip >/dev/null || sudo apt-get install -y -qq unzip)
          curl -fsSL --retry 5 --retry-delay 10 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          mkdir -p "$HOME/gradle" && unzip -q -o /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.14.3/bin" >> $GITHUB_PATH

      - name: Generate + stage client and broker
        run: |
          nu scripts/generate_bindings.nu kotlin mqtt-client
          nu scripts/generate_bindings.nu kotlin mqtt-broker
          ./packaging/kotlin/stage.sh 0.0.0-ci

      - name: Run the packaged-library smoke test
        working-directory: packaging/kotlin
        run: gradle test --no-daemon

  # ── 9. Do the per-language packages build? (no upload, no credentials) ───────
  # dotnet pack (NuGet), gradle build (Maven), npm pack, OCI bundle assembly.
  test-packaging:
    name: package-${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        language: [java, csharp, node, go, dart, haskell]
    steps:
      - uses: actions/checkout@v4

      # Retried: static.rust-lang.org is intermittently unreachable from the runner,
      # and the binding jobs all start at once. `minimal` skips rustfmt/clippy/docs
      # (these jobs only compile), which also means far fewer downloads to fail.
      - name: Install Rust stable
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          for attempt in 1 2 3 4 5; do
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal && break
            echo "rustup install failed (attempt $attempt); retrying in 20s"; sleep 20
          done
          command -v cargo >/dev/null || { echo "rustup could not be installed"; exit 1; }
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      - name: Install Nushell
        run: cargo install nu --locked

      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "22"
      # gradle/actions/setup-gradle can't be resolved by this Gitea ("Unable to resolve
      # v4: unsupported object type" at job setup — it fails every job that references it,
      # even behind an `if:`), so install Gradle directly.
      - name: Install Gradle
        if: matrix.language == 'java'
        run: |
          (command -v unzip >/dev/null || sudo apt-get install -y -qq unzip)
          curl -fsSL --retry 5 --retry-delay 10 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          mkdir -p "$HOME/gradle" && unzip -q -o /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.14.3/bin" >> $GITHUB_PATH
      - uses: actions/setup-node@v4
        if: matrix.language == 'node'
        with:
          node-version: "22"
      - uses: dart-lang/setup-dart@v1
        if: matrix.language == 'dart'

      - name: Install the generator
        run: nu scripts/install_bindgens.nu ${{ matrix.language }}

      - name: Stage and build the ${{ matrix.language }} package
        run: nu scripts/publish_packages.nu verify ${{ matrix.language }}
