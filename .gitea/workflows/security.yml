name: Security

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths: ["Cargo.lock", "Cargo.toml", "**/Cargo.toml", "deny.toml", ".cargo/audit.toml"]
  pull_request:
    paths: ["Cargo.lock", "Cargo.toml", "**/Cargo.toml", "deny.toml", ".cargo/audit.toml"]
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          for attempt in 1 2 3 4 5; do
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable && break
            echo "rustup install failed (attempt $attempt); retrying in 20s"; sleep 20
          done
          [ -x "$HOME/.cargo/bin/cargo" ] || { echo "rustup could not be installed"; exit 1; }
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Generate lockfile (if absent)
        run: '[ -f Cargo.lock ] || cargo generate-lockfile'
      - name: Audit dependencies
        run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          for attempt in 1 2 3 4 5; do
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable && break
            echo "rustup install failed (attempt $attempt); retrying in 20s"; sleep 20
          done
          [ -x "$HOME/.cargo/bin/cargo" ] || { echo "rustup could not be installed"; exit 1; }
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check advisories, licenses, bans, sources
        run: cargo deny check
