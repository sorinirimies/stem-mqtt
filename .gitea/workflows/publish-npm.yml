name: Publish npm

# Publishes the Node.js package `stem-mqtt` (client + broker) to npmjs.org without cutting a release.
# Run it from the Actions tab: "Run workflow". The release workflow publishes the same package (and skips
# it when the version is already on npm), so the two never conflict.
#
# Secret: NPM_TOKEN — an npm granular access token with publish rights and "bypass 2FA".
# This runner is Linux, so the package carries the Linux x86_64 prebuild (package.json `os`/`cpu`
# say so; `npm install` elsewhere fails with EBADPLATFORM).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (default: the workspace version in Cargo.toml)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: build, test and pack, but don't publish (true/false)"
        required: false
        default: "false"

concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PUBLIC_OWNER: sorinirimies

jobs:
  publish:
    name: Test and publish stem-mqtt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          for attempt in 1 2 3 4 5; do
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal && break
            echo "rustup install failed (attempt $attempt); retrying in 20s"; sleep 20
          done
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - name: Install Nushell
        run: cargo install nu --locked

      - uses: actions/setup-node@v4
        id: node_try
        continue-on-error: true
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-node@v4
        if: steps.node_try.outcome == 'failure'
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Restore generator cache
        uses: actions/cache@v4
        with:
          path: ~/.bindgens
          key: bindgens-node-${{ hashFiles('scripts/bindings/spec.nu') }}
      - name: Install the generator
        run: |
          echo "$HOME/.bindgens/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bindgens/bin:$PATH"
          nu scripts/install_bindgens.nu node --root "$HOME/.bindgens"

      - name: Resolve the version
        id: version
        run: |
          v="${{ github.event.inputs.version }}"
          [ -n "$v" ] || v="$(nu scripts/version.nu)"
          echo "Publishing stem-mqtt@$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Runs the smoke test in-tree and again as a consumer of the packed tarball.
      - name: Runtime-test the bindings
        run: nu scripts/test_bindings.nu node --strict
      - name: Stage the package
        run: nu scripts/publish_packages.nu stage node

      - name: Publish stem-mqtt
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ] && [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            echo "::error::NPM_TOKEN is not set (granular access token with publish rights and bypass 2FA)"; exit 1
          fi
          flag=""; [ "${{ github.event.inputs.dry_run }}" = "true" ] && flag="--dry-run"
          nu scripts/publish_packages.nu publish node "${{ steps.version.outputs.version }}" \
            --target public --owner "$PUBLIC_OWNER" $flag
