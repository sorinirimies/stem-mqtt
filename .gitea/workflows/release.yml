name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 0. Validate tag ──────────────────────────────────────────────────────────
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag '${TAG}' does not match vX.Y.Z — aborting."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # ── 1. Quality gate ───────────────────────────────────────────────────────────
  test:
    name: Test & lint
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          . "$HOME/.cargo/env"
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Nushell
        run: cargo install nu --locked
      - name: Quality gate
        run: nu scripts/ci/quality_gate.nu

  # ── 2. Linux builds (native + aarch64 cross) ──────────────────────────────────
  build-linux:
    name: Build mqtt-broker Linux — ${{ matrix.target }}
    needs: [validate, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross: false
          - target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install cross-linker (aarch64)
        if: matrix.cross == true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install Rust stable + target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          . "$HOME/.cargo/env"
          rustup target add ${{ matrix.target }}

      - name: Configure aarch64 cross-linker
        if: matrix.cross == true
        run: |
          mkdir -p ~/.cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"'   >> ~/.cargo/config.toml

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build mqtt-broker
        run: cargo build --release -p stem-mqtt-broker --bin mqtt-broker --target ${{ matrix.target }}

      - name: Stage tarball
        run: |
          out="mqtt-broker-${{ needs.validate.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$out"
          cp target/${{ matrix.target }}/release/mqtt-broker "$out/"
          cp README.md LICENSE "$out/"
          tar czf "${out}.tar.gz" "$out"

      - uses: actions/upload-artifact@v3
        with:
          name: linux-${{ matrix.target }}
          path: "*.tar.gz"
          retention-days: 1

  # ── 3. Windows cross-compile from Linux (mingw-w64) ───────────────────────────
  build-windows:
    name: Build mqtt-broker Windows x86_64 (cross from Linux)
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install mingw-w64 cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Install Rust stable + Windows target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          . "$HOME/.cargo/env"
          rustup target add x86_64-pc-windows-gnu

      - name: Configure Windows cross-linker
        run: |
          mkdir -p ~/.cargo
          echo '[target.x86_64-pc-windows-gnu]'    >> ~/.cargo/config.toml
          echo 'linker = "x86_64-w64-mingw32-gcc"' >> ~/.cargo/config.toml
          echo 'ar = "x86_64-w64-mingw32-ar"'      >> ~/.cargo/config.toml

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-gnu

      - name: Build mqtt-broker for Windows
        run: cargo build --release -p stem-mqtt-broker --bin mqtt-broker --target x86_64-pc-windows-gnu

      - name: Stage zip
        run: |
          out="mqtt-broker-${{ needs.validate.outputs.version }}-x86_64-pc-windows-gnu"
          mkdir -p "$out"
          cp target/x86_64-pc-windows-gnu/release/mqtt-broker.exe "$out/"
          cp README.md LICENSE "$out/"
          zip -r "${out}.zip" "$out"

      - uses: actions/upload-artifact@v3
        with:
          name: windows-x86_64
          path: "*.zip"
          retention-days: 1

  # ── 4. Create Gitea Release ───────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [validate, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install git-cliff
        run: cargo install git-cliff --locked
      - name: Install Nushell
        run: cargo install nu --locked
      - name: Generate release notes
        run: nu scripts/ci/release_notes.nu ${{ needs.validate.outputs.tag }}

      - uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Flatten artifact directories
        run: |
          cd artifacts
          find . -mindepth 2 -type f -exec mv {} . \; 2>/dev/null || true
          find . -empty -type d -delete 2>/dev/null || true

      - name: Create Gitea Release
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          GITEA_URL="${{ github.server_url }}"
          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"

          RELEASE_BODY=$(python3 -c 'import sys,json; print(json.dumps(open("RELEASE_NOTES.md").read()))')
          RESPONSE=$(curl -s -X POST \
            "${GITEA_URL}/api/v1/repos/${REPO}/releases" \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":${RELEASE_BODY},\"draft\":false,\"prerelease\":false}")

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])' 2>/dev/null)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "None" ]; then
            echo "❌ Failed to create release: $RESPONSE"; exit 1
          fi

          for file in artifacts/* LICENSE README.md CHANGELOG.md; do
            [ -f "$file" ] || continue
            FILENAME=$(basename "$file")
            echo "📦 Uploading ${FILENAME}..."
            curl -s -X POST \
              "${GITEA_URL}/api/v1/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${FILENAME}" \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" > /dev/null
          done
          echo "✅ Release ${TAG} published."

  # ── 5. Publish to crates.io ───────────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: [validate, release]
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CRATES_IO_TOKEN != '' }}
    steps:
      - name: Skip (no token)
        if: env.HAS_TOKEN != 'true'
        run: echo "⏭️  CRATES_IO_TOKEN not set — skipping."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust stable
        if: env.HAS_TOKEN == 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_TOKEN == 'true'
      - name: Install Nushell
        if: env.HAS_TOKEN == 'true'
        run: cargo install nu --locked

      - name: Publish mqtt-client (must go first — mqtt-broker depends on it)
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: nu scripts/ci/publish_crate.nu stem-mqtt-client ${{ needs.validate.outputs.version }} --readme-dir crates/mqtt-client --wait 30

      - name: Publish mqtt-broker
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: nu scripts/ci/publish_crate.nu stem-mqtt-broker ${{ needs.validate.outputs.version }} --readme-dir crates/mqtt-broker --wait 0

  # ── Per-language packages → this Gitea's own package registries ──────────────
  # Maven (Java), NuGet (C#), npm (Node) and the container registry (Go, Dart,
  # Haskell as OCI bundles) are all built into Gitea. Needs a repository secret
  # PACKAGES_TOKEN: a Gitea access token with the `write:package` scope.
  # (GitHub Packages publishing for the same packages lives in the GitHub
  # release workflow; both use scripts/publish_packages.nu.)
  publish-packages:
    name: Publish ${{ matrix.language }} package
    needs: [validate, release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        language: [java, csharp, node, go, dart, haskell]
    env:
      HAS_TOKEN: ${{ secrets.PACKAGES_TOKEN != '' }}
    steps:
      - name: Skip (no token)
        if: env.HAS_TOKEN != 'true'
        run: echo "⏭️  PACKAGES_TOKEN not set — skipping ${{ matrix.language }} package."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust stable
        if: env.HAS_TOKEN == 'true'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          for attempt in 1 2 3 4 5; do
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal && break
            echo "rustup install failed (attempt $attempt); retrying in 20s"; sleep 20
          done
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_TOKEN == 'true'
      - name: Install Nushell
        if: env.HAS_TOKEN == 'true'
        run: cargo install nu --locked

      - uses: actions/setup-dotnet@v4
        if: env.HAS_TOKEN == 'true' && matrix.language == 'csharp'
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        if: env.HAS_TOKEN == 'true' && matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "22"
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true' && matrix.language == 'node'
        with:
          node-version: "22"
          # writes the .npmrc auth line (from NODE_AUTH_TOKEN) for Gitea's npm registry
          registry-url: ${{ github.server_url }}/api/packages/${{ github.repository_owner }}/npm/
          scope: "@${{ github.repository_owner }}"
      - uses: dart-lang/setup-dart@v1
        if: env.HAS_TOKEN == 'true' && matrix.language == 'dart'
      - uses: haskell-actions/setup@v2
        if: env.HAS_TOKEN == 'true' && matrix.language == 'haskell'
      - name: Install Gradle
        if: env.HAS_TOKEN == 'true' && matrix.language == 'java'
        run: |
          (command -v unzip >/dev/null || sudo apt-get install -y -qq unzip)
          curl -fsSL --retry 5 --retry-delay 10 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          mkdir -p "$HOME/gradle" && unzip -q -o /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.14.3/bin" >> $GITHUB_PATH
      - name: Install oras
        if: env.HAS_TOKEN == 'true' && (matrix.language == 'go' || matrix.language == 'dart' || matrix.language == 'haskell')
        run: |
          curl -fsSL --retry 5 https://github.com/oras-project/oras/releases/download/v1.2.2/oras_1.2.2_linux_amd64.tar.gz | tar xz -C /tmp oras
          sudo install -m755 /tmp/oras /usr/local/bin/oras

      - name: Restore generator cache
        if: env.HAS_TOKEN == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bindgens
          key: bindgens-${{ matrix.language }}-${{ hashFiles('scripts/bindings/spec.nu', 'packaging/haskell/uniffi-bindgen-haskell.patch') }}
      - name: Install the generator
        if: env.HAS_TOKEN == 'true'
        run: |
          export PATH="$HOME/.bindgens/bin:$PATH"
          echo "$HOME/.bindgens/bin" >> $GITHUB_PATH
          nu scripts/install_bindgens.nu ${{ matrix.language }} --root "$HOME/.bindgens"

      - name: Runtime-test the bindings before publishing them
        if: env.HAS_TOKEN == 'true'
        run: nu scripts/test_bindings.nu ${{ matrix.language }} --strict
      - name: Stage ${{ matrix.language }}
        if: env.HAS_TOKEN == 'true'
        run: nu scripts/publish_packages.nu stage ${{ matrix.language }}

      - name: Log in to the container registry
        if: env.HAS_TOKEN == 'true' && (matrix.language == 'go' || matrix.language == 'dart' || matrix.language == 'haskell')
        run: |
          host="$(echo '${{ github.server_url }}' | sed -E 's#^https?://##')"
          echo "${{ secrets.PACKAGES_TOKEN }}" | oras login "$host" -u "${{ github.repository_owner }}" --password-stdin --plain-http

      - name: Publish ${{ matrix.language }} to Gitea packages
        if: env.HAS_TOKEN == 'true'
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          PACKAGES_USER: ${{ github.repository_owner }}
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: >
          nu scripts/publish_packages.nu publish ${{ matrix.language }}
          ${{ needs.validate.outputs.version }}
          --target gitea
          --base-url ${{ github.server_url }}
          --owner ${{ github.repository_owner }}

  # ── Kotlin (JVM jar) → Gitea Maven registry ──────────────────────────────────
  # The Android AAR needs the NDK + Android SDK and stays on the GitHub release
  # workflow; the JVM package (client + broker, native libs bundled) is built here.
  publish-kotlin:
    name: Publish Kotlin (JVM) package
    needs: [validate, release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_TOKEN: ${{ secrets.PACKAGES_TOKEN != '' }}
    steps:
      - name: Skip (no token)
        if: env.HAS_TOKEN != 'true'
        run: echo "⏭️  PACKAGES_TOKEN not set — skipping the Kotlin package."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Install Rust stable
        if: env.HAS_TOKEN == 'true'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          for attempt in 1 2 3 4 5; do
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal && break
            echo "rustup install failed (attempt $attempt); retrying in 20s"; sleep 20
          done
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_TOKEN == 'true'
      - name: Install Nushell
        if: env.HAS_TOKEN == 'true'
        run: cargo install nu --locked
      - uses: actions/setup-java@v4
        if: env.HAS_TOKEN == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        if: env.HAS_TOKEN == 'true'
        run: |
          (command -v unzip >/dev/null || sudo apt-get install -y -qq unzip)
          curl -fsSL --retry 5 --retry-delay 10 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          mkdir -p "$HOME/gradle" && unzip -q -o /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.14.3/bin" >> $GITHUB_PATH

      - name: Generate + stage client and broker
        if: env.HAS_TOKEN == 'true'
        run: |
          nu scripts/generate_bindings.nu kotlin mqtt-client
          nu scripts/generate_bindings.nu kotlin mqtt-broker
          ./packaging/kotlin/stage.sh ${{ needs.validate.outputs.version }}
      - name: Run the packaged-library smoke test
        if: env.HAS_TOKEN == 'true'
        working-directory: packaging/kotlin
        run: gradle test --no-daemon
      - name: Publish to Gitea Maven
        if: env.HAS_TOKEN == 'true'
        working-directory: packaging/kotlin
        env:
          PACKAGES_USER: ${{ github.repository_owner }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: gradle publish --no-daemon -PmavenUrl=${{ github.server_url }}/api/packages/${{ github.repository_owner }}/maven

  # ── Python wheels → Gitea PyPI registry ──────────────────────────────────────
  publish-python:
    name: Publish Python wheels
    needs: [validate, release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_TOKEN: ${{ secrets.PACKAGES_TOKEN != '' }}
    steps:
      - name: Skip (no token)
        if: env.HAS_TOKEN != 'true'
        run: echo "⏭️  PACKAGES_TOKEN not set — skipping the Python wheels."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Install Rust stable
        if: env.HAS_TOKEN == 'true'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          for attempt in 1 2 3 4 5; do
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal && break
            echo "rustup install failed (attempt $attempt); retrying in 20s"; sleep 20
          done
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_TOKEN == 'true'
        with:
          python-version: "3.12"
      - name: Build the client and broker wheels
        if: env.HAS_TOKEN == 'true'
        run: |
          pip install maturin twine
          maturin build --release --manifest-path crates/mqtt-client/Cargo.toml -o dist
          maturin build --release --manifest-path crates/mqtt-broker/Cargo.toml -o dist
      - name: Smoke-test the wheels
        if: env.HAS_TOKEN == 'true'
        run: |
          pip install dist/*.whl
          python packaging/python/smoke_test.py
      - name: Upload to Gitea PyPI
        if: env.HAS_TOKEN == 'true'
        env:
          TWINE_USERNAME: ${{ github.repository_owner }}
          TWINE_PASSWORD: ${{ secrets.PACKAGES_TOKEN }}
        run: twine upload --repository-url ${{ github.server_url }}/api/packages/${{ github.repository_owner }}/pypi dist/*
