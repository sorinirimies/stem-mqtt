[package]
name = "stem-mqtt-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
stem-mqtt-client = { path = "../crates/mqtt-client" }

# The targets `use mqtt_client::…`, the library name of stem-mqtt-client; cargo
# machete matches package names only, so it would call it unused.
[package.metadata.cargo-machete]
ignored = ["stem-mqtt-client"]

# Not part of the main workspace: fuzzing needs nightly + cargo-fuzz.
[workspace]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false

[[bin]]
name = "topics"
path = "fuzz_targets/topics.rs"
test = false
doc = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false

[[bin]]
name = "chunked"
path = "fuzz_targets/chunked.rs"
test = false
doc = false

[[bin]]
name = "varint"
path = "fuzz_targets/varint.rs"
test = false
doc = false

[[bin]]
name = "publish"
path = "fuzz_targets/publish.rs"
test = false
doc = false
